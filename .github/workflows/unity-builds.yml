name: Unity Builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build ("all" runs the full matrix)
        required: true
        default: all
        type: choice
        options:
          - all
          - iOS
          - Android
          - Windows

jobs:
  build:
    name: ${{ matrix.name }}
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.name)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            target: StandaloneWindows
            runner: ubuntu-latest
            buildMethod: SceneExporter.BuildWindowsStandaloneDev
            artifactPath: UberStrike.Unity/Latest/WindowsStandalone
          - name: Android
            target: Android
            runner: ubuntu-latest
            buildMethod: SceneExporter.BuildAndroidDev
            artifactPath: UberStrike.Unity/Latest/Android/*.apk
          - name: iOS
            target: iOS
            runner: macos-15-intel
            buildMethod: SceneExporter.BuildiOS
    runs-on: ${{ matrix.runner }}
    environment: Unity

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.8.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Cache
        uses: actions/cache@v4
        with:
          path: UberStrike.Unity/Library
          key: Library-${{ matrix.target }}-${{ hashFiles('UberStrike.Unity/Assets/**', 'UberStrike.Unity/Packages/**', 'UberStrike.Unity/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.target }}-

      - name: Build ${{ matrix.name }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UberStrike.Unity
          targetPlatform: ${{ matrix.target }}
          buildMethod: ${{ matrix.buildMethod }}
          versioning: Custom
          version: ${{ steps.gitversion.outputs.informationalVersion }}

      - name: Build iOS .ipa
        if: matrix.target == 'iOS'
        run: |
          xcodebuild \
            -project UberStrike.Unity/BuildIos/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath UberStrike.Unity/BuildIos/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="UberStrike.Unity/BuildIos/DerivedData/Build/Products/Debug-iphoneos/uberstrike.app"
          VERSION="${{ steps.gitversion.outputs.informationalVersion }}"
          VERSION="${VERSION//[^A-Za-z0-9._+-]/-}"
          IPA_PATH="$PWD/UberStrike.Unity/BuildIos/UberStrike-iOS-${VERSION}.ipa"
          STAGE="UberStrike.Unity/BuildIos/ipa-stage"

          test -d "$APP_PATH"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          (cd "$STAGE" && ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_PATH")

          unzip -l "$IPA_PATH" | head -20

      - name: Upload Build Artifact
        if: matrix.target != 'iOS'
        uses: actions/upload-artifact@v4
        with:
          name: UberStrike-${{ matrix.name }}-${{ steps.gitversion.outputs.informationalVersion }}
          path: ${{ matrix.artifactPath }}

      - name: Upload iOS IPA
        if: matrix.target == 'iOS'
        uses: actions/upload-artifact@v4
        with:
          name: UberStrike-iOS-IPA-${{ steps.gitversion.outputs.informationalVersion }}
          path: UberStrike.Unity/BuildIos/*.ipa
