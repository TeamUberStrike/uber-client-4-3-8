name: Unity Builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.8.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Cache
        uses: actions/cache@v4
        with:
          path: UberStrike.Unity/Library
          key: Library-${{ hashFiles('UberStrike.Unity/Assets/**', 'UberStrike.Unity/Packages/**', 'UberStrike.Unity/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build Windows Standalone (Internal Dev)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UberStrike.Unity
          targetPlatform: StandaloneWindows
          buildMethod: SceneExporter.BuildWindowsStandaloneDev

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UberStrike-${{ steps.gitversion.outputs.informationalVersion }}
          path: UberStrike.Unity/Latest/WindowsStandalone
